<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2 gegen 50</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Great+Vibes&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#050816;--panel:#0d1640;--ink:#f2f5ff;--muted:#8d99cc;--line:#2a3878;
  --cyan:#2bd4ff;--cyan-g:rgba(43,212,255,.5);--gold:#ffc54a;--gold-g:rgba(255,197,74,.55);
  --red:#ff3f5e;--red-g:rgba(255,63,94,.5);--green:#2fe39a;--green-g:rgba(47,227,154,.5);
  --display:"Bebas Neue",Impact,"Arial Narrow",sans-serif;--sans:Inter,system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0;color:inherit}
input,textarea{font:inherit}
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;z-index:1}

/* ---------- Studio-Hintergrund ---------- */
.stage{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  background:
    radial-gradient(ellipse 55% 45% at 50% -8%, rgba(43,212,255,.30), transparent 70%),
    radial-gradient(ellipse 45% 60% at -5% 105%, rgba(130,70,255,.30), transparent 70%),
    radial-gradient(ellipse 45% 60% at 105% 105%, rgba(255,60,170,.22), transparent 70%),
    linear-gradient(180deg,#081033 0%,#050816 60%,#04060f 100%)}
.stage::before{content:"";position:absolute;left:50%;top:-60vmax;width:220vmax;height:220vmax;margin-left:-110vmax;
  background:repeating-conic-gradient(from 0deg at 50% 50%, rgba(43,212,255,.07) 0deg 3deg, transparent 3deg 15deg);
  animation:sweep 40s linear infinite;mask-image:radial-gradient(circle at 50% 50%, black 0%, transparent 45%);-webkit-mask-image:radial-gradient(circle at 50% 50%, black 0%, transparent 45%)}
.stage::after{content:"";position:absolute;left:-50%;right:-50%;bottom:-6%;height:42%;
  background-image:linear-gradient(rgba(43,212,255,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(43,212,255,.22) 1px,transparent 1px);
  background-size:64px 64px;transform:perspective(500px) rotateX(62deg);transform-origin:bottom;
  mask-image:linear-gradient(to top,black 10%,transparent 90%);-webkit-mask-image:linear-gradient(to top,black 10%,transparent 90%)}
@keyframes sweep{to{transform:rotate(360deg)}}

/* ---------- Grundelemente ---------- */
.muted{color:var(--muted)}
.eyebrow{font-family:var(--display);font-size:22px;letter-spacing:.14em;color:var(--cyan);text-shadow:0 0 12px var(--cyan-g)}
.btn{font-family:var(--display);font-size:24px;letter-spacing:.08em;padding:12px 30px;border-radius:12px;color:#1b1203;
  background:linear-gradient(180deg,#ffe08a,#f2b021);box-shadow:0 0 24px var(--gold-g),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .08s,opacity .2s,filter .2s}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.3;cursor:not-allowed;box-shadow:none}
.btn.big{font-size:32px;padding:16px 44px}
.btn.ghost{background:rgba(10,18,60,.6);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.small{font-size:19px;padding:9px 20px}
.card{background:linear-gradient(180deg,rgba(20,34,96,.82),rgba(9,16,56,.88));border:1px solid var(--line);border-radius:20px;
  box-shadow:inset 0 0 0 1px rgba(43,212,255,.08),0 24px 70px rgba(0,0,0,.45);backdrop-filter:blur(6px)}
.status{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--green);box-shadow:0 0 10px var(--green-g)}.dot.bad{background:var(--red);box-shadow:0 0 10px var(--red-g)}
.led{background:#040820;border:1px solid var(--line);border-radius:12px;padding:6px 16px 7px;text-align:center;min-width:92px;box-shadow:inset 0 0 18px rgba(43,212,255,.08)}
.led b{display:block;font-family:var(--display);font-size:46px;line-height:1;color:var(--cyan);text-shadow:0 0 14px var(--cyan-g);font-weight:400}
.led small{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.led.dim b{color:var(--red);text-shadow:0 0 14px var(--red-g)}

/* Sechseck-Panels */
.hex{--cut:30px;clip-path:polygon(var(--cut) 0,calc(100% - var(--cut)) 0,100% 50%,calc(100% - var(--cut)) 100%,var(--cut) 100%,0 50%)}
.frame{display:block;padding:2px;background:linear-gradient(90deg,#33449a,#6f86ff,#33449a)}
.frame>.in{--cut:29px;display:flex;align-items:center;gap:16px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#16236a 0%,#0a1242 55%,#070d33 100%)}

/* ---------- Leinwand ---------- */
.h-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;padding:16px 32px}
.logo{display:flex;align-items:baseline;gap:10px;font-family:var(--display);line-height:1}
.logo b{font-weight:400;font-size:58px}
.logo .g{color:var(--ink);text-shadow:0 0 18px rgba(255,240,220,.4)}
.logo .c{color:var(--cyan);text-shadow:0 0 18px var(--cyan-g)}
.logo small{font-size:26px;letter-spacing:.18em;color:var(--ink);opacity:.85}
.pill{display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:28px;letter-spacing:.08em;
  padding:8px 22px;border-radius:999px;background:rgba(5,9,35,.75);border:1px solid var(--line)}
.pill span{color:var(--gold);text-shadow:0 0 10px var(--gold-g)}
.score{justify-self:end;display:flex;align-items:center;gap:12px}
.h-main{flex:1;padding:12px 40px 28px;display:flex;flex-direction:column;gap:22px;max-width:1600px;width:100%;margin:0 auto}
.h-foot{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap;align-items:center}

.lobby{display:grid;grid-template-columns:minmax(320px,430px) 1fr;gap:26px;flex:1;min-height:0}
.joinbox{padding:30px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.joinbox h2{font-family:var(--display);font-weight:400;font-size:54px;letter-spacing:.04em;margin:0;line-height:1}
.joinbox p{margin:0;font-size:15px;line-height:1.5}
.joinbox .btn{width:100%}
#qr{background:#fff;padding:14px;border-radius:14px;box-shadow:0 0 40px var(--cyan-g)}
#qr img,#qr canvas{display:block}
.url{font-size:12px;word-break:break-all;color:var(--muted)}
.warn{background:rgba(255,63,94,.15);border:1px solid var(--red);color:#ffc2cc;padding:12px 16px;border-radius:12px;font-size:14px}
.playersbox{padding:24px 28px;display:flex;flex-direction:column;gap:16px;min-height:0}
.pb-head{display:flex;justify-content:space-between;align-items:center}
.pb-head h3{margin:0;font-family:var(--display);font-weight:400;font-size:44px;letter-spacing:.05em}
.wall-scroll{flex:1;overflow:auto;min-height:120px}
.settings{display:flex;gap:20px;flex-wrap:wrap;align-items:center;padding-top:14px;border-top:1px solid var(--line)}
.settings label{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.settings input{width:66px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#040820;color:var(--ink);font-weight:600;text-align:center}

/* Gäste-Wand */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:7px}
.tile{position:relative;font-size:14px;font-weight:600;padding:9px 10px;border-radius:7px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:linear-gradient(180deg,rgba(43,212,255,.22),rgba(43,212,255,.08));border:1px solid rgba(43,212,255,.55);box-shadow:0 0 10px rgba(43,212,255,.18)}
.tile.off{opacity:.45}
.tile.gone{opacity:.16;background:rgba(255,255,255,.04);border-color:transparent;box-shadow:none}
.tile.outnow{background:linear-gradient(180deg,rgba(255,63,94,.45),rgba(255,63,94,.15));border-color:var(--red);box-shadow:0 0 14px var(--red-g);animation:blink .35s 5 alternate}
.tile button{position:absolute;right:3px;top:50%;transform:translateY(-50%);background:none;color:var(--muted);font-size:16px;padding:0 4px;opacity:0}
.tile:hover button{opacity:1}
@keyframes blink{from{filter:brightness(1.8)}to{filter:brightness(.7)}}

/* Themenwahl */
.center-title{text-align:center}
.center-title h1{font-family:var(--display);font-weight:400;font-size:clamp(50px,6vw,92px);letter-spacing:.04em;margin:4px 0 0;line-height:1;text-shadow:0 0 30px rgba(43,212,255,.35)}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px 18px}
.topic{background:none;padding:0;text-align:center;filter:drop-shadow(0 0 0 transparent);transition:filter .15s,transform .1s}
.topic .in{flex-direction:column;justify-content:center;gap:2px;min-height:104px;padding:10px 36px}
.topic b{font-family:var(--display);font-weight:400;font-size:36px;letter-spacing:.05em}
.topic small{font-size:13px;color:var(--muted)}
.topic:hover:not(:disabled){filter:drop-shadow(0 0 16px var(--gold-g));transform:translateY(-2px)}
.topic:hover:not(:disabled) .frame{background:var(--gold)}
.topic:disabled{opacity:.25;cursor:not-allowed}

/* Frage */
.qwrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px}
.qtop{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;min-height:110px}
.phase{display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:30px;letter-spacing:.08em}
.live{width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red-g);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}
.qpanel{filter:drop-shadow(0 0 22px rgba(43,212,255,.35))}
.qpanel .frame{background:linear-gradient(90deg,#1b8fd0,var(--cyan),#1b8fd0)}
.qpanel .in{justify-content:center;min-height:170px;padding:26px 90px}
.qpanel.hex,.qpanel .hex{--cut:56px}
.question{font-size:clamp(30px,3.2vw,54px);line-height:1.18;font-weight:700;margin:0;text-align:center;letter-spacing:-.01em}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px 22px}
.opt{display:block;background:none;padding:0;text-align:left;transition:filter .2s}
.opt .in{min-height:92px;padding:14px 46px}
.opt .l{position:relative;z-index:1;font-family:var(--display);font-size:40px;color:var(--gold);text-shadow:0 0 12px var(--gold-g);flex:none;width:30px}
.opt .txt{position:relative;z-index:1;flex:1;font-size:clamp(20px,1.9vw,30px);font-weight:600;line-height:1.2}
.opt .cnt{position:relative;z-index:1;font-family:var(--display);font-size:42px;color:var(--ink)}
.opt .bar{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(255,255,255,.08),rgba(255,255,255,.18));transition:width .9s cubic-bezier(.2,.8,.2,1)}
.opt .bar.aud{background:linear-gradient(90deg,rgba(43,212,255,.15),rgba(43,212,255,.38))}
.opt.locked .in{opacity:.55}
.opt[data-couple]{cursor:pointer}
.opt[data-couple]:hover .frame{background:linear-gradient(90deg,#b8862a,var(--gold),#b8862a)}
.opt.couple{filter:drop-shadow(0 0 18px var(--gold-g))}
.opt.couple .frame{background:linear-gradient(90deg,#c38f22,#ffe08a,#c38f22)}
.opt.couple .in{background:linear-gradient(180deg,#6b4b0e,#33230a)}
.opt.right{filter:drop-shadow(0 0 22px var(--green-g))}
.opt.right .frame{background:linear-gradient(90deg,#16a56c,var(--green),#16a56c)}
.opt.right .in{background:linear-gradient(180deg,#118058,#063c29)}
.opt.wrong .in{opacity:.45}
.opt.wrong.couple{filter:drop-shadow(0 0 18px var(--red-g))}
.opt.wrong.couple .frame{background:linear-gradient(90deg,#b02039,var(--red),#b02039)}
.opt.wrong.couple .in{opacity:1;background:linear-gradient(180deg,#6d1424,#33070f)}
.tag{display:inline-block;margin-left:12px;font-size:.55em;font-weight:700;padding:4px 11px;border-radius:999px;vertical-align:middle;letter-spacing:.02em}
.tag.gold{background:var(--gold);color:#2a1b02}
.tag.cyan{background:var(--cyan);color:#03233a}
.info{text-align:center;font-size:22px;color:var(--muted)}
.info b{color:var(--ink)}
.jkres{align-self:center;padding:10px 22px;border-radius:999px;border:1px solid var(--cyan);background:rgba(43,212,255,.12);font-size:20px;box-shadow:0 0 18px rgba(43,212,255,.25)}
.verdict{text-align:center;font-family:var(--display);font-size:clamp(44px,4.5vw,72px);letter-spacing:.05em;line-height:1}
.verdict.good{color:var(--green);text-shadow:0 0 24px var(--green-g)}
.verdict.bad{color:var(--red);text-shadow:0 0 24px var(--red-g)}
.outline{text-align:center;font-size:22px;color:var(--muted)}
.outline b{font-family:var(--display);font-size:34px;font-weight:400}
.outline .red{color:var(--red)}.outline .cy{color:var(--cyan)}

.qwrap.rv{gap:14px}
.qwrap.rv .qtop{min-height:0}
.qwrap.rv .qpanel .in{min-height:110px;padding:16px 80px}
.qwrap.rv .question{font-size:clamp(26px,2.6vw,42px)}
.qwrap.rv .opt .in{min-height:76px}
.qwrap.rv .wall{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:5px}
.qwrap.rv .tile{font-size:13px;padding:6px 8px}
/* Timer */
.ring{width:110px;height:110px;position:relative;justify-self:center}
.ring svg{transform:rotate(-90deg);filter:drop-shadow(0 0 8px var(--cyan-g))}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:52px;font-weight:400}

/* Joker */
.jokers{justify-self:end;display:flex;gap:14px}
.joker{width:96px;height:96px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;
  border:2px solid var(--cyan);background:radial-gradient(circle at 50% 35%,#1d4c9c,#0a1440 70%);box-shadow:0 0 22px var(--cyan-g),inset 0 0 18px rgba(43,212,255,.3);
  font-family:var(--display);font-size:15px;letter-spacing:.08em;transition:transform .1s}
.joker .ic{font-size:34px;line-height:1}
.joker:hover:not(:disabled){transform:scale(1.06)}
.joker:disabled{cursor:default}
.joker:disabled:not(.used){opacity:.55;box-shadow:none}
.joker.used{opacity:.3;box-shadow:none;border-color:var(--muted)}
.joker.used::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:4px;background:var(--red);transform:rotate(-40deg);border-radius:2px;box-shadow:0 0 8px var(--red-g)}
.topic-foot{display:flex;justify-content:space-between;align-items:center;gap:14px}

/* Ende */
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px;position:relative}
.end h1{font-family:var(--display);font-weight:400;font-size:clamp(64px,9vw,150px);letter-spacing:.03em;margin:0;line-height:.95}
.end h1.gold{color:var(--gold);text-shadow:0 0 40px var(--gold-g)}
.end h1.cy{color:var(--cyan);text-shadow:0 0 40px var(--cyan-g)}
.end h1.red{color:var(--red);text-shadow:0 0 40px var(--red-g)}
.end .sub{font-size:26px;color:var(--muted);margin:0}
.winners{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:1100px}
.winners .tile{font-size:24px;padding:12px 24px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;opacity:.9;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(2,4,15,.72);display:grid;place-items:center;padding:20px;z-index:10;backdrop-filter:blur(4px)}
.modal .card{width:min(980px,100%);max-height:92vh;display:flex;flex-direction:column;gap:14px;padding:26px;overflow:auto}
.modal h3{margin:0;font-family:var(--display);font-weight:400;font-size:44px;letter-spacing:.05em}
.modal p{margin:0}
.modal textarea{width:100%;flex:1;min-height:50vh;border:1px solid var(--line);border-radius:12px;padding:14px;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.5;resize:vertical;background:#040820;color:var(--ink)}
.modal .row{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.pickwall .tile{cursor:pointer;font-size:16px;padding:12px}
.pickwall .tile:hover{border-color:var(--gold);box-shadow:0 0 14px var(--gold-g)}

/* ---------- Handy ---------- */
.p{flex:1;display:flex;flex-direction:column;padding:14px 16px calc(18px + env(safe-area-inset-bottom));max-width:560px;width:100%;margin:0 auto;gap:14px}
.p-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.p-top .logo b{font-size:38px}.p-top .logo small{font-size:18px}
.p-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px}
.p h1{font-family:var(--display);font-weight:400;font-size:46px;letter-spacing:.04em;line-height:1;margin:0;text-align:center}
.p p{margin:0;text-align:center;font-size:17px;line-height:1.45}
.p input[type=text]{width:100%;padding:16px 18px;border-radius:14px;border:1px solid var(--line);font-size:18px;background:#040820;color:var(--ink)}
.p .btn{width:100%;font-size:28px;padding:15px}
.p .eyebrow{text-align:center;font-size:19px}
.p .qpanel .in{min-height:0;padding:18px 30px}
.p .qpanel .hex{--cut:22px}
.p .question{font-size:23px}
.p .opts{grid-template-columns:1fr;gap:10px}
.p .opt .hex{--cut:20px}
.p .opt .in{min-height:64px;padding:10px 30px;gap:12px}
.p .opt .l{font-size:30px;width:22px}
.p .opt .txt{font-size:18px}
.p .opt.picked{filter:drop-shadow(0 0 14px var(--gold-g))}
.p .opt.picked .frame{background:linear-gradient(90deg,#c38f22,#ffe08a,#c38f22)}
.p .opt.picked .in{background:linear-gradient(180deg,#6b4b0e,#33230a)}
.p .ring{width:76px;height:76px}.p .ring b{font-size:36px}
.p .qhead{display:flex;justify-content:center}
.big-emoji{font-size:64px;text-align:center;line-height:1;filter:drop-shadow(0 0 18px rgba(255,255,255,.25))}
.badge{align-self:center;padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px;text-align:center}
.badge.ok{background:rgba(47,227,154,.15);color:var(--green);border:1px solid var(--green)}
.badge.out{background:rgba(255,63,94,.15);color:#ff9aab;border:1px solid var(--red)}
.badge.cy{background:rgba(43,212,255,.15);color:var(--cyan);border:1px solid var(--cyan)}
.badge.gold{background:rgba(255,197,74,.15);color:var(--gold);border:1px solid var(--gold)}
.hint{font-size:14px;color:var(--muted);text-align:center}

@media (max-width:1000px){
  .lobby{grid-template-columns:1fr}
  .h-main{padding:12px 16px 20px}
  .h-top{padding:12px 16px;grid-template-columns:1fr auto}
  .h-top .pill{display:none}
  .qtop{grid-template-columns:1fr 1fr}
  .qtop .ring{justify-self:end}
  .qtop .jokers{grid-column:1/-1;justify-self:center}
}

/* ================= FESTLICHES THEMA ================= */
:root{
  --bg:#14060f;--ink:#fff6ea;--muted:#c9a9a6;--line:#6b3b44;
  --cyan:#ffb3c4;--cyan-g:rgba(255,179,196,.5);
  --gold:#f3cf7a;--gold-g:rgba(243,207,122,.55);
  --display:"Playfair Display",Georgia,serif;--script:"Great Vibes","Brush Script MT",cursive;
}
.stage{background:
    radial-gradient(ellipse 60% 45% at 50% -5%, rgba(243,207,122,.28), transparent 70%),
    radial-gradient(ellipse 50% 60% at -5% 100%, rgba(170,40,90,.35), transparent 70%),
    radial-gradient(ellipse 50% 60% at 105% 100%, rgba(150,30,70,.35), transparent 70%),
    linear-gradient(180deg,#2a0c1f 0%,#170712 55%,#0e040a 100%)}
.stage::before{background:repeating-conic-gradient(from 0deg at 50% 50%, rgba(243,207,122,.06) 0deg 3deg, transparent 3deg 15deg)}
.stage::after{background-image:none;background:radial-gradient(ellipse 60% 100% at 50% 100%, rgba(243,207,122,.18), transparent 70%);transform:none;height:30%;bottom:0}
.bokeh{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,226,160,.55),rgba(255,226,160,0) 70%);animation:float linear infinite,twinkle ease-in-out infinite alternate}
.bokeh.r{background:radial-gradient(circle,rgba(255,170,195,.45),rgba(255,170,195,0) 70%)}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-110vh)}}
@keyframes twinkle{from{opacity:.25}to{opacity:1}}
.garland{position:absolute;left:0;right:0;top:0;height:90px}
.garland path{fill:none;stroke:rgba(243,207,122,.35);stroke-width:1.5}
.bulb{position:absolute;width:7px;height:7px;margin:-3px 0 0 -3px;opacity:.85;border-radius:50%;background:#ffe9b0;box-shadow:0 0 8px 3px rgba(255,214,130,.75),0 0 22px 8px rgba(255,190,90,.25);animation:twinkle 1.6s ease-in-out infinite alternate}
.spark{position:absolute;color:#ffe2a0;font-size:14px;text-shadow:0 0 8px rgba(255,220,150,.9);animation:twinkle 2.2s ease-in-out infinite alternate}

/* Typo */
.eyebrow{font-family:var(--sans);font-size:15px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);text-shadow:0 0 12px var(--gold-g)}
.logo{gap:8px;align-items:center}
.logo b{font-family:var(--display);font-weight:700;font-size:54px}
.logo small{font-family:var(--script);font-size:40px;letter-spacing:0;color:var(--cyan);opacity:1;text-shadow:0 0 14px var(--cyan-g);text-transform:none}
.logo .c{color:var(--gold);text-shadow:0 0 18px var(--gold-g)}
.logo .heart{font-size:22px;color:var(--cyan);text-shadow:0 0 12px var(--cyan-g)}
.pill{font-family:var(--display);font-size:24px;letter-spacing:.02em;border-color:rgba(243,207,122,.45);background:rgba(30,8,20,.75)}
.pill span{font-style:italic}
.led{background:#1c0812;border-color:rgba(243,207,122,.4);box-shadow:inset 0 0 18px rgba(243,207,122,.08)}
.led b{font-family:var(--display);font-weight:700;font-size:40px;color:var(--gold);text-shadow:0 0 14px var(--gold-g)}
.led.dim b{color:var(--cyan);text-shadow:0 0 14px var(--cyan-g)}
.btn{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;background:linear-gradient(180deg,#fff0c2,#e7b956 55%,#c8952f);color:#3a2205}
.btn.big{font-size:28px}
.btn.small{font-size:17px}
.btn.ghost{background:rgba(40,10,25,.6);color:var(--ink);border-color:rgba(243,207,122,.35)}
.card{background:linear-gradient(180deg,rgba(70,20,45,.82),rgba(35,9,24,.9));border-color:rgba(243,207,122,.35);box-shadow:inset 0 0 0 1px rgba(243,207,122,.1),0 24px 70px rgba(0,0,0,.5)}
.joinbox h2,.pb-head h3,.modal h3{font-family:var(--display);font-weight:700;letter-spacing:0}
.joinbox h2{font-size:46px}.pb-head h3{font-size:38px}.modal h3{font-size:38px}
#qr{box-shadow:0 0 40px var(--gold-g);border:3px solid var(--gold)}
.settings input{background:#1c0812}

/* Goldene Rahmen */
.frame{background:linear-gradient(90deg,#7d5a22,#f6e2a6,#b78b3c,#f6e2a6,#7d5a22)}
.frame>.in{background:linear-gradient(180deg,#5a1834 0%,#33091d 55%,#250615 100%)}
.qpanel{filter:drop-shadow(0 0 26px rgba(243,207,122,.35))}
.qpanel .frame{background:linear-gradient(90deg,#9c7330,#fff1c4,#c99a45,#fff1c4,#9c7330);padding:3px}
.qpanel .in{background:radial-gradient(ellipse at 50% 0%,#6e2142,#2c0819 75%)}
.opt .l{color:var(--gold);font-family:var(--display);font-weight:700;font-size:34px}
.opt .cnt{font-family:var(--display);font-weight:700;font-size:36px}
.opt .bar{background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.16))}
.opt .bar.aud{background:linear-gradient(90deg,rgba(255,179,196,.15),rgba(255,179,196,.4))}
.opt[data-couple]:hover .frame{background:linear-gradient(90deg,#c38f22,#fff3c8,#c38f22)}
.opt.couple .frame{background:linear-gradient(90deg,#c38f22,#fff3c8,#c38f22)}
.opt.couple .in{background:linear-gradient(180deg,#8a6215,#43290a)}
.tag.cyan{background:var(--cyan);color:#4a0d22}
.center-title h1{font-family:var(--display);font-weight:700;font-style:italic;letter-spacing:0;font-size:clamp(46px,5.4vw,84px);text-shadow:0 0 30px rgba(243,207,122,.35)}
.center-title h1::before,.center-title h1::after{content:"♥";font-style:normal;font-size:.4em;color:var(--cyan);vertical-align:middle;margin:0 .5em;text-shadow:0 0 12px var(--cyan-g)}
.topic b{font-family:var(--display);font-weight:700;letter-spacing:0;font-size:27px;line-height:1.1}
.topic:hover:not(:disabled) .frame{background:linear-gradient(90deg,#c38f22,#fff3c8,#c38f22)}
.phase{font-family:var(--display);font-style:italic;font-size:28px;letter-spacing:0}
.live{background:var(--cyan);box-shadow:0 0 12px var(--cyan-g)}
.ring svg{filter:drop-shadow(0 0 8px var(--gold-g))}
.ring b{font-family:var(--display);font-weight:700;font-size:44px}
.verdict{font-family:var(--display);font-weight:700;font-style:italic;letter-spacing:0}
.outline b{font-family:var(--display);font-weight:700}
.jkres{border-color:var(--cyan);background:rgba(255,179,196,.12);box-shadow:0 0 18px rgba(255,179,196,.25)}

/* Gäste-Wand */
.tile{background:linear-gradient(180deg,rgba(243,207,122,.22),rgba(243,207,122,.07));border-color:rgba(243,207,122,.55);box-shadow:0 0 10px rgba(243,207,122,.15)}
.pickwall .tile{color:var(--ink)}

/* Joker */
.joker{font-family:var(--display);font-weight:700;letter-spacing:0;font-size:14px;border-color:var(--gold);
  background:radial-gradient(circle at 50% 35%,#7a2a4c,#2c0819 70%);box-shadow:0 0 22px var(--gold-g),inset 0 0 18px rgba(243,207,122,.25)}

/* Ende */
.end h1{font-family:var(--display);font-weight:700;font-style:italic;letter-spacing:0;font-size:clamp(54px,7vw,120px)}
.end h1.cy{color:var(--cyan)}
.end .ornament{font-family:var(--script);font-size:56px;color:var(--gold);text-shadow:0 0 18px var(--gold-g);line-height:1}

/* Handy */
.p h1{font-family:var(--display);font-weight:700;font-style:italic;letter-spacing:0;font-size:38px}
.p-top .logo b{font-size:34px}.p-top .logo small{font-size:28px}
.p .btn{font-size:24px}
.p .eyebrow{font-size:12px}
.p .ring b{font-size:30px}
.p .opt.picked .frame{background:linear-gradient(90deg,#c38f22,#fff3c8,#c38f22)}
.p .opt.picked .in{background:linear-gradient(180deg,#8a6215,#43290a)}
.p input[type=text]{background:#1c0812}
.badge.cy{background:rgba(255,179,196,.15);color:var(--cyan);border-color:var(--cyan)}
/* Titelbild */
.title{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
.t-head{text-align:center}
.t-title{font-family:var(--display);font-weight:700;font-size:clamp(40px,4.6vw,76px);line-height:1.05;margin:6px 0 0;text-shadow:0 0 30px rgba(243,207,122,.35)}
.t-title .script{font-family:var(--script);font-weight:400;color:var(--cyan);font-size:1.15em;text-shadow:0 0 18px var(--cyan-g);padding:0 .1em}
.t-arena{flex:1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;min-height:0}
.t-side{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:0}
.t-pic{width:min(100%,460px);aspect-ratio:1/1;max-height:52vh;display:grid;place-items:center;border-radius:50%;position:relative;
  background:radial-gradient(circle at 50% 45%,rgba(110,33,66,.9),rgba(40,8,25,.95) 70%);
  box-shadow:0 0 0 3px #c99a45,0 0 0 9px rgba(243,207,122,.15),0 0 60px rgba(243,207,122,.35);overflow:hidden}
.t-pic.crowd{box-shadow:0 0 0 3px #c99a45,0 0 0 9px rgba(255,179,196,.15),0 0 60px rgba(255,179,196,.3)}
.t-pic .ill{width:92%;height:92%;margin-top:8%}
.t-pic img{width:100%;height:100%;object-fit:cover}
.t-name{font-family:var(--display);font-weight:700;font-size:clamp(30px,3vw,48px);margin-top:14px;color:var(--gold);text-shadow:0 0 18px var(--gold-g)}
.t-sub{font-size:14px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.t-vs{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle at 40% 35%,#fff3c8,#e7b956 45%,#a87a2c 100%);box-shadow:0 0 50px var(--gold-g),inset 0 -6px 14px rgba(0,0,0,.25);animation:vsPulse 2.4s ease-in-out infinite}
.t-vs::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px dashed rgba(243,207,122,.55);animation:sweep 30s linear infinite}
.t-vs span{font-family:var(--script);font-size:56px;color:#4a1028;line-height:1;margin-top:6px}
@keyframes vsPulse{50%{transform:scale(1.06);box-shadow:0 0 80px var(--gold-g),inset 0 -6px 14px rgba(0,0,0,.25)}}
.beat{transform-origin:165px 56px;animation:vsPulse 1.4s ease-in-out infinite}
.ph{filter:drop-shadow(0 0 4px rgba(255,230,160,.9))}
.t-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.t-photo{cursor:pointer;display:inline-block}
@media (max-width:1000px){
  .t-arena{grid-template-columns:1fr;justify-items:center}
  .t-pic{width:min(80vw,340px)}
  .t-vs{width:110px;height:110px}.t-vs span{font-size:42px}
}

/* ================= HELL & FESTLICH ================= */
:root{
  --bg:#fbf3e6;--ink:#3b2a22;--muted:#8a7362;--line:#ead8bc;
  --gold:#c18f35;--gold-g:rgba(214,166,72,.45);--goldsoft:#f7e4b8;
  --cyan:#d0607f;--cyan-g:rgba(208,96,127,.35);--rose:#d0607f;--rosesoft:#fbe1e7;
  --green:#3f9a6a;--green-g:rgba(63,154,106,.35);--red:#cf4456;--red-g:rgba(207,68,86,.35);
}
html,body{background:var(--bg);color:var(--ink)}
.stage{background:
    radial-gradient(ellipse 70% 50% at 50% -10%, rgba(255,214,140,.75), transparent 70%),
    radial-gradient(ellipse 45% 55% at 0% 100%, rgba(248,196,208,.55), transparent 70%),
    radial-gradient(ellipse 45% 55% at 100% 100%, rgba(200,222,190,.55), transparent 70%),
    linear-gradient(180deg,#fff6e6 0%,#fbf0df 55%,#f7e7d2 100%)}
.stage::before{background:repeating-conic-gradient(from 0deg at 50% 50%, rgba(214,166,72,.09) 0deg 3deg, transparent 3deg 15deg)}
.stage::after{background:radial-gradient(ellipse 60% 100% at 50% 100%, rgba(255,214,140,.35), transparent 70%)}
.bulb{width:12px;height:12px;margin:-6px 0 0 -6px;background:radial-gradient(circle at 40% 35%,#fffbe8,#ffd36b 60%,#f0b13c);opacity:1;
  box-shadow:0 0 10px 3px rgba(255,200,90,.7),0 0 26px 10px rgba(255,190,80,.3)}
.bokeh{background:radial-gradient(circle,rgba(255,205,110,.45),rgba(255,205,110,0) 70%)}
.bokeh.r{background:radial-gradient(circle,rgba(240,150,175,.35),rgba(240,150,175,0) 70%)}
.spark{color:#d9a441;text-shadow:0 0 6px rgba(255,200,90,.8)}
.garland-wire{position:absolute;left:0;right:0;top:0;width:100%;height:60px}
.garland-wire path{fill:none;stroke:rgba(110,80,50,.45);stroke-width:1.2}

/* Typo & Grundelemente */
.muted{color:var(--muted)}
.eyebrow{color:var(--gold);text-shadow:none}
.status{color:var(--muted)}
.btn{color:#3b2405;background:linear-gradient(180deg,#ffeebe,#f0c45c 55%,#d9a13b);box-shadow:0 6px 18px rgba(193,143,53,.35),inset 0 1px 0 rgba(255,255,255,.8)}
.btn.ghost{background:rgba(255,255,255,.85);color:var(--ink);border:1px solid #e2c999;box-shadow:0 2px 8px rgba(120,80,30,.08)}
.card{background:rgba(255,253,248,.92);border:1px solid #e8d2a6;box-shadow:0 18px 50px rgba(150,100,40,.15);backdrop-filter:blur(4px)}
.joinbox h2,.pb-head h3,.modal h3{color:var(--ink)}
.settings{border-top-color:var(--line)}
.settings input,.p input[type=text],.modal textarea{background:#fff;color:var(--ink);border-color:#e2c999}
.warn{background:#fdecee;border-color:var(--red);color:#8e2433}
#qr{box-shadow:0 10px 30px rgba(150,100,40,.25);border:3px solid #e2c27a}

/* Logo */
.logo{display:flex;flex-direction:column;align-items:flex-start;gap:0;line-height:1}
.logo .names{font-family:var(--display);font-weight:700;font-size:40px;color:var(--ink);text-shadow:none;white-space:nowrap}
.logo .names i{font-style:normal;color:var(--rose)}
.logo .vs{font-family:var(--script);font-size:30px;color:var(--rose);text-shadow:none;margin-top:-2px;white-space:nowrap}
.logo .vs b{font-family:var(--display);font-style:italic;font-weight:600;font-size:22px;color:var(--gold)}
.p-top .logo .names{font-size:26px}.p-top .logo .vs{font-size:22px}.p-top .logo .vs b{font-size:16px}

.pill{background:rgba(255,255,255,.9);border-color:#e2c999;color:var(--ink);box-shadow:0 4px 14px rgba(150,100,40,.12)}
.pill span{color:var(--gold);text-shadow:none}
.led{background:rgba(255,255,255,.92);border-color:#e2c999;box-shadow:0 4px 14px rgba(150,100,40,.12)}
.led b{color:var(--gold);text-shadow:none}
.led.dim b{color:var(--rose);text-shadow:none}
.led small{color:var(--muted)}

/* Panels */
.frame{background:linear-gradient(90deg,#c9963f,#f6dd9c,#d4a24a,#f6dd9c,#c9963f)}
.frame>.in{background:linear-gradient(180deg,#fffdf8 0%,#fbf1df 100%);color:var(--ink)}
.qpanel{filter:drop-shadow(0 10px 24px rgba(193,143,53,.3))}
.qpanel .frame{background:linear-gradient(90deg,#c9963f,#fff0c4,#d4a24a,#fff0c4,#c9963f);padding:3px}
.qpanel .in{background:radial-gradient(ellipse at 50% 0%,#ffffff,#fcf2e1 80%)}
.question{color:var(--ink)}
.opt{filter:drop-shadow(0 6px 14px rgba(150,100,40,.12))}
.opt .l{color:var(--gold);text-shadow:none}
.opt .txt,.opt .cnt{color:var(--ink)}
.opt .bar{background:linear-gradient(90deg,rgba(193,143,53,.10),rgba(193,143,53,.22))}
.opt .bar.aud{background:linear-gradient(90deg,rgba(208,96,127,.12),rgba(208,96,127,.3))}
.opt[data-couple]:hover .frame,.opt.couple .frame,.topic:hover:not(:disabled) .frame,.p .opt.picked .frame{background:linear-gradient(90deg,#b98326,#ffe39a,#b98326)}
.opt.couple{filter:drop-shadow(0 0 16px rgba(214,166,72,.55))}
.opt.couple .in,.p .opt.picked .in{background:linear-gradient(180deg,#fff1c9,#f6d98e)}
.p .opt.picked{filter:drop-shadow(0 0 14px rgba(214,166,72,.55))}
.opt.right{filter:drop-shadow(0 0 18px rgba(63,154,106,.45))}
.opt.right .frame{background:linear-gradient(90deg,#2f8a5b,#8fd6ad,#2f8a5b)}
.opt.right .in{background:linear-gradient(180deg,#e9f8ee,#c6ebd3)}
.opt.wrong .in{opacity:1}
.opt.wrong{opacity:.45;filter:saturate(.6)}
.opt.wrong.couple{opacity:1;filter:drop-shadow(0 0 16px rgba(207,68,86,.45))}
.opt.wrong.couple .frame{background:linear-gradient(90deg,#b5334a,#f3a0ab,#b5334a)}
.opt.wrong.couple .in{opacity:1;background:linear-gradient(180deg,#fdecee,#f8d0d6)}
.tag.gold{background:var(--gold);color:#fff}
.tag.cyan{background:var(--rose);color:#fff}
.info{color:var(--muted)}.info b{color:var(--ink)}
.jkres{background:rgba(255,255,255,.9);border-color:var(--rose);color:var(--ink);box-shadow:0 6px 18px rgba(208,96,127,.18)}
.verdict.good{color:var(--green);text-shadow:0 4px 18px rgba(63,154,106,.25)}
.verdict.bad{color:var(--red);text-shadow:0 4px 18px rgba(207,68,86,.25)}
.outline{color:var(--muted)}.outline .red{color:var(--red)}.outline .cy{color:var(--gold)}

/* Themen */
.center-title h1{color:var(--ink);text-shadow:0 4px 24px rgba(214,166,72,.3)}
.center-title h1::before,.center-title h1::after{color:var(--rose);text-shadow:none}
.topic small{color:var(--muted)}
.topic:hover:not(:disabled){filter:drop-shadow(0 8px 18px rgba(214,166,72,.45))}
.phase{color:var(--ink)}
.live{background:var(--rose);box-shadow:0 0 10px var(--cyan-g)}
.ring svg{filter:none}
.ring b{color:var(--ink)}

/* Gäste-Wand */
.tile{background:linear-gradient(180deg,#ffffff,#fbf1df);border:1px solid #e2c999;color:var(--ink);box-shadow:0 2px 8px rgba(150,100,40,.1)}
.tile.gone{opacity:.3;background:rgba(255,255,255,.5);box-shadow:none}
.tile.outnow{background:linear-gradient(180deg,#fde3e7,#f8c4cc);border-color:var(--red);color:#8e2433;box-shadow:0 0 12px rgba(207,68,86,.35)}
.tile button{color:var(--muted)}
.pickwall .tile:hover{border-color:var(--gold);box-shadow:0 0 12px rgba(214,166,72,.5)}

/* Joker */
.joker{color:var(--ink);border-color:#d4a24a;background:radial-gradient(circle at 50% 35%,#ffffff,#fbeccc 75%);box-shadow:0 6px 18px rgba(193,143,53,.35)}
.joker.used{border-color:#cbb9a2;opacity:.45}

/* Ende */
.end h1.gold{color:var(--gold);text-shadow:0 6px 30px rgba(214,166,72,.4)}
.end h1.cy{color:var(--rose);text-shadow:0 6px 30px rgba(208,96,127,.3)}
.end h1.red{color:var(--red);text-shadow:0 6px 30px rgba(207,68,86,.3)}
.end .sub{color:var(--muted)}
.end .ornament{color:var(--gold);text-shadow:none}

/* Modal */
.modal{background:rgba(70,45,30,.35)}

/* Handy */
.p h1{color:var(--ink)}
.big-emoji{filter:none}
.hint{color:var(--muted)}
.badge.ok{background:#e6f6ec;color:#2f7a52;border-color:var(--green)}
.badge.out{background:#fdecee;color:#a8364a;border-color:var(--red)}
.badge.cy{background:var(--rosesoft);color:#a8405f;border-color:var(--rose)}
.badge.gold{background:#fdf2d6;color:#8e6420;border-color:var(--gold)}

/* Titelbild (Bild) */
.tshot{position:fixed;inset:0;z-index:5;background:#000;display:grid;place-items:center;overflow:hidden}
.tshot-bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(30px) brightness(.45)}
.tshot-img{position:relative;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;box-shadow:0 0 80px rgba(0,0,0,.6)}
.btn.big.tshot-btn{position:absolute;right:clamp(16px,3vw,48px);bottom:clamp(16px,4vh,48px);font-size:clamp(26px,2.4vw,38px);padding:16px 54px;animation:vsPulse 2.4s ease-in-out infinite}
/* Handy: ausgeschieden */
.outshot{position:fixed;inset:0;z-index:20;background:#000;display:grid;place-items:center;overflow:hidden}
.outshot-img{position:relative;max-width:100%;max-height:100%;object-fit:contain}
.outshot-cap{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));text-align:center;font-size:16px;line-height:1.35;
  padding:12px 16px;border-radius:16px;background:rgba(20,8,14,.88);border:1px solid rgba(243,207,122,.5);color:#fff6ea;backdrop-filter:blur(6px)}
.outshot-cap b{color:var(--gold)}
/* Joker (persönlich) */
.jokers{flex-wrap:wrap;justify-content:flex-end;gap:10px}
.joker{width:88px;height:88px;font-size:11.5px}
.joker .ic{font-size:30px}
.joker.ready{animation:jReady 1.4s ease-in-out infinite}
@keyframes jReady{50%{transform:scale(1.07);box-shadow:0 0 0 6px rgba(214,166,72,.25),0 8px 22px rgba(193,143,53,.45)}}
.opt.removed{opacity:.18;filter:grayscale(1)}
.opt.removed .txt{text-decoration:line-through}
.verdict.revived{color:var(--rose);text-shadow:0 4px 18px rgba(208,96,127,.3);animation:revive .9s ease-in-out 3}
@keyframes revive{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(1)}45%{transform:scale(1.08)}}
.blackout{position:fixed;inset:0;z-index:8;background:#0b0705;display:grid;place-items:center;text-align:center;color:#fff6ea;animation:flick 2.6s linear 1}
.blackout::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(255,214,120,.18),transparent 60%);animation:flick 4s steps(1) infinite}
.bo-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;padding:20px}
.bo-bolt{font-size:110px;line-height:1;filter:drop-shadow(0 0 30px rgba(255,214,90,.8));animation:flick 1.8s steps(1) infinite}

/* ---- Verbindung über Supabase Realtime ----
   Handys -> Bildschirm: REST-Nachrichten in den Kanal "hz-up-<Spiel>" (nur der Bildschirm hört zu)
   Bildschirm -> Handys: eine gebündelte Nachricht in "hz-down-<Spiel>" für alle (höchstens ~1 pro Sekunde) */
function installSupabasePeer(){
  const rid = n => { const a="abcdefghjkmnpqrstuvwxyz23456789"; let s=""; for(let i=0;i<n;i++) s+=a[Math.floor(Math.random()*a.length)]; return s; };
  class Em{ constructor(){ this._h={}; } on(e,f){ (this._h[e]=this._h[e]||[]).push(f); return this; } emit(e,...a){ (this._h[e]||[]).forEach(f=>{ try{ f(...a); }catch(err){ console.error(err); } }); } }
  let client=null;
  function cfg(){ return (SUPABASE_CONFIG && SUPABASE_CONFIG.url && SUPABASE_CONFIG.key) ? SUPABASE_CONFIG : (params.has("sbtest") ? {url:"http://localhost:9200",key:"test"} : null); }
  function getClient(){
    if(client) return client;
    const c=cfg(); if(typeof supabase==="undefined" || !c) return null;
    try{ client=supabase.createClient(c.url,c.key,{auth:{persistSession:false,autoRefreshToken:false},realtime:{params:{eventsPerSecond:20}}}); }catch(e){ console.error(e); return null; }
    return client;
  }
  window.__getSb=getClient;
  const BAD=["CHANNEL_ERROR","TIMED_OUT","CLOSED"];
  class Conn extends Em{
    constructor(peer,remote){ super(); this.peer=peer; this.peer_id=remote; this.open=false; }
    send(data){ if(this.open) this.peer._send(this,data); }
    close(){ if(!this.open) return; this.open=false; this.peer._conns.delete(this.peer_id); this.emit("close"); }
  }
  class SbPeer extends Em{
    constructor(id){
      super(); this.isHost=!!id; this.id=id||("p"+rid(14)); this.open=false; this.destroyed=false;
      this._conns=new Map(); this._seen=new Map(); this._pending={}; this._lastFlush=0; this._flushT=null;
      const c=getClient();
      if(!c){ setTimeout(()=>this.emit("error",{type: cfg() ? "broker" : "config"}),0); return; }
      this._c=c;
      if(this.isHost){
        this._upCh=c.channel("hz-up-"+this.id,{config:{broadcast:{self:false}}});
        this._upCh.on("broadcast",{event:"up"},msg=>this._hostMsg(msg&&msg.payload));
        this._downCh=c.channel("hz-down-"+this.id,{config:{broadcast:{self:false}}});
        this._upCh.subscribe(s=>{
          if(s==="SUBSCRIBED"){ if(!this.open){ this.open=true; clearTimeout(this._failT); this.emit("open",this.id); } else this.emit("reconnected"); }
          else if(this.open && BAD.includes(s)) this.emit("disconnected");
        });
        this._downCh.subscribe(s=>{ if(s==="SUBSCRIBED") this._hello(); });
        this._sweep=setInterval(()=>{ const now=Date.now(); this._conns.forEach((cn,k)=>{ if(now-(this._seen.get(k)||0)>30000) cn.close(); }); },5000);
      } else {
        setTimeout(()=>{ this.open=true; this.emit("open",this.id); },0);
      }
      this._failT=setTimeout(()=>{ if(!this.open && !this.destroyed) this.emit("error",{type:"broker"}); },20000);
      window.addEventListener("pagehide",()=>this.destroy());
    }
    status(){ return "Supabase "+(this.open?"✓":"✗"); }
    _hello(){ try{ this._downCh.send({type:"broadcast",event:"hello",payload:{t:Date.now()}}); }catch(e){} }
    /* --- Bildschirm --- */
    _hostMsg(m){
      if(!m || !m.from) return;
      this._seen.set(m.from,Date.now());
      if(m.k==="bye"){ const cn=this._conns.get(m.from); if(cn) cn.close(); return; }
      const cn=this._hostConn(m.from);
      if(m.k==="hb"){ if((cn._fresh || m.re) && m.pid){ cn._fresh=false; cn.emit("data",{t:"join",pid:m.pid,name:m.name||"Gast"}); } return; }
      if(m.k==="d"){ cn._fresh=false; let data; try{ data=JSON.parse(m.d); }catch(e){ return; } cn.emit("data",data); }
    }
    _hostConn(remote){
      let cn=this._conns.get(remote);
      if(!cn){ cn=new Conn(this,remote); cn.open=true; cn._fresh=true; this._conns.set(remote,cn); this.emit("connection",cn); cn.emit("open"); }
      return cn;
    }
    _send(conn,data){
      if(this.isHost){ this._pending[conn.peer_id]=data; this._schedule(); }
      else this._http({from:this.id,k:"d",d:JSON.stringify(data)});
    }
    _schedule(){
      if(this._flushT) return;
      const wait=Math.max(0, 1200-(Date.now()-this._lastFlush));
      this._flushT=setTimeout(()=>{ this._flushT=null; this._flush(); }, Math.max(60,wait));
    }
    _flush(){
      const views=this._pending; this._pending={}; const ids=Object.keys(views); if(!ids.length) return;
      this._lastFlush=Date.now();
      const common=Object.assign({},views[ids[ids.length-1]]); delete common.me;
      const m={}; ids.forEach(k=>{ m[k]=views[k].me==null?null:views[k].me; });
      try{ const r=this._downCh.send({type:"broadcast",event:"all",payload:{c:JSON.stringify(common),m}}); if(r&&r.catch) r.catch(()=>{}); }catch(e){}
    }
    /* --- Handy --- */
    _http(payload){
      if(!this._upCh) return;
      try{ const r=this._upCh.httpSend("up",payload); if(r&&r.catch) r.catch(()=>{}); }catch(e){}
    }
    connect(target,opts){
      const meta=(opts&&opts.metadata)||{}; this._meta=meta;
      const c=this._c;
      this._upCh=c.channel("hz-up-"+target);
      const cn=new Conn(this,target); this._conns.set(target,cn); this._conn=cn;
      this._downCh=c.channel("hz-down-"+target,{config:{broadcast:{self:false}}});
      this._downCh.on("broadcast",{event:"all"},msg=>{
        const p=msg&&msg.payload; if(!p||!p.m||!Object.prototype.hasOwnProperty.call(p.m,this.id)) return;
        let data; try{ data=JSON.parse(p.c); }catch(e){ return; } data.me=p.m[this.id];
        if(cn.open) cn.emit("data",data);
      });
      this._downCh.on("broadcast",{event:"hello"},()=>this._hb(true));
      this._downCh.subscribe(s=>{
        if(s==="SUBSCRIBED"){ if(!cn.open){ cn.open=true; cn.emit("open"); } this._hb(true); }
      });
      clearInterval(this._hbT); this._hbT=setInterval(()=>this._hb(false),10000);
      return cn;
    }
    _hb(re){ this._http({from:this.id,k:"hb",re:!!re,pid:this._meta&&this._meta.pid,name:this._meta&&this._meta.name}); }
    reconnect(){}
    destroy(){
      if(this.destroyed) return; this.destroyed=true; clearTimeout(this._failT); clearInterval(this._hbT); clearInterval(this._sweep);
      if(!this.isHost && this._upCh) this._http({from:this.id,k:"bye"});
      try{ this._downCh && this._c.removeChannel(this._downCh); }catch(e){}
      try{ this.isHost && this._upCh && this._c.removeChannel(this._upCh); }catch(e){}
    }
  }
  window.Peer=SbPeer;
}

/* ---- Testmodus: ersetzt PeerJS durch Verbindung zwischen Browser-Tabs (kein Internet nötig) ---- */
function installFakePeer(){
  const seen=new Set(), listeners=[];
  let bc=null; try{ bc=new BroadcastChannel("hz-test"); bc.onmessage=e=>deliver(e.data); }catch(e){}
  window.addEventListener("storage",e=>{ if(e.key==="hz_bus" && e.newValue){ try{ deliver(JSON.parse(e.newValue)); }catch(_){} } });
  function post(m){ m.mid=Math.random().toString(36).slice(2)+Date.now(); try{ bc&&bc.postMessage(m); }catch(e){} try{ localStorage.setItem("hz_bus",JSON.stringify(m)); }catch(e){} }
  function deliver(m){ if(!m||!m.mid||seen.has(m.mid)) return; seen.add(m.mid); listeners.slice().forEach(f=>f(m)); }
  class Em{ constructor(){ this._h={}; } on(e,f){ (this._h[e]=this._h[e]||[]).push(f); return this; } emit(e,...a){ (this._h[e]||[]).forEach(f=>{ try{ f(...a); }catch(err){ console.error(err); } }); } }
  class Conn extends Em{
    constructor(peer,remote,cid){ super(); this.peer=peer; this.peer_id=remote; this.cid=cid; this.open=false; }
    send(data){ if(this.open) post({k:"data",to:this.peer_id,from:this.peer.id,cid:this.cid,data}); }
    close(){ const was=this.open; this.open=false; this.peer._conns.delete(this.cid); post({k:"close",to:this.peer_id,cid:this.cid}); if(was) this.emit("close"); }
  }
  class FakePeer extends Em{
    constructor(id){ super(); this.id=id||("p"+Math.random().toString(36).slice(2,10)); this.open=false; this.destroyed=false; this._conns=new Map();
      this._l=m=>this._msg(m); listeners.push(this._l);
      window.addEventListener("pagehide",()=>this.destroy());
      setTimeout(()=>{ this.open=true; post({k:"reset",from:this.id}); this.emit("open",this.id); },60); }
    _msg(m){
      if(this.destroyed) return;
      if(m.k==="reset"){ this._conns.forEach(c=>{ if(c.peer_id===m.from && c.open){ c.open=false; this._conns.delete(c.cid); c.emit("close"); } }); return; }
      if(m.to!==this.id) return;
      if(m.k==="connect"){ const c=new Conn(this,m.from,m.cid); this._conns.set(m.cid,c); c.open=true; this.emit("connection",c); post({k:"ack",to:m.from,cid:m.cid}); setTimeout(()=>c.emit("open"),0); return; }
      const c=this._conns.get(m.cid); if(!c) return;
      if(m.k==="ack"){ c.open=true; clearTimeout(c._t); c.emit("open"); }
      if(m.k==="data") c.emit("data",m.data);
      if(m.k==="close"){ this._conns.delete(m.cid); if(c.open){ c.open=false; c.emit("close"); } }
    }
    connect(target){ const cid="c"+Math.random().toString(36).slice(2,10); const c=new Conn(this,target,cid); this._conns.set(cid,c);
      post({k:"connect",to:target,from:this.id,cid});
      c._t=setTimeout(()=>{ if(!c.open){ this._conns.delete(cid); this.emit("error",{type:"peer-unavailable"}); } },3000); return c; }
    reconnect(){}
    destroy(){ if(this.destroyed) return; this._conns.forEach(c=>c.close()); this.destroyed=true; const i=listeners.indexOf(this._l); if(i>=0) listeners.splice(i,1); }
  }
  window.Peer=FakePeer;
}

const rand = n => { const a="abcdefghjkmnpqrstuvwxyz23456789"; let s=""; for(let i=0;i<n;i++) s+=a[Math.floor(Math.random()*a.length)]; return s; };

const shuffle = arr => { const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

function parseBank(text){
  const cats=[]; let cur=null;
  String(text).split("\n").forEach(line=>{
    const l=line.trim();
    if(!l || l.startsWith("//")) return;
    if(l.startsWith("#")){ cur={name:l.replace(/^#+/,"").trim(),qs:[]}; if(cur.name) cats.push(cur); return; }
    if(!cur) return;
    const p=l.split("|").map(x=>x.trim()).filter(Boolean);
    if(p.length>=3) cur.qs.push({q:p[0],right:p[1],wrong:p.slice(2,5)});
  });
  return cats.filter(c=>c.qs.length);
}

function ring(deadline,total){
  const r=36, c=2*Math.PI*r;
  return `<div class="ring" data-deadline="${deadline}" data-total="${total}">
    <svg viewBox="0 0 84 84" width="100%" height="100%"><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--line)" stroke-width="6"/>
    <circle class="arc" cx="42" cy="42" r="${r}" fill="none" stroke="var(--cyan)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="0"/></svg><b>–</b></div>`;
}
setInterval(()=>{
  document.querySelectorAll(".ring[data-deadline]").forEach(el=>{
    const left=Math.max(0,+el.dataset.deadline-Date.now()), tot=Math.max(1,+el.dataset.total);
    el.querySelector("b").textContent=Math.ceil(left/1000);
    const arc=el.querySelector(".arc"), c=2*Math.PI*36;
    arc.setAttribute("stroke-dashoffset", String(c*(1-left/tot)));
    arc.setAttribute("stroke", left<3000 ? "var(--red)" : "var(--cyan)");
  });
},100);

function host(){
  let bankText = store.get("hz_bank", DEFAULT_QUESTIONS);
  let bank = parseBank(bankText);
  let S = store.get("hz_state", null) || fresh();
  let hostId = store.get("hz_hostid", null);
  if(!hostId){ hostId = "hz2v50-" + rand(6); store.set("hz_hostid", hostId); }
  if(TEST) hostId = "test";
  const conns = {};               // pid -> DataConnection
  let peer=null, peerOk=false, peerErr="", timer=null, editor=false, picker=false;
  if(!S.jokers || !("reanimate" in S.jokers)) S.jokers={reanimate:false,blackout:false,witness:false,apres:false,detour:false}; S.jk=S.jk||{}; S.outIds=S.outIds||[];

  function fresh(){ return {phase:"title",players:{},round:0,topic:null,q:null,used:[],endsAt:0,phaseMs:0,stats:null,out:[],couple:null,coupleLost:false,jokers:{reanimate:false,blackout:false,witness:false,apres:false,detour:false},jk:{},outIds:[],settings:{read:0,answer:10}}; }
  const pre = () => S.phase==="lobby" || S.phase==="title";
  const list = () => Object.entries(S.players).map(([id,p])=>Object.assign({id},p));
  const alive = () => list().filter(p=>p.alive);
  const joinUrl = () => (location.protocol==="file:" ? location.href.split("?")[0] : location.origin + location.pathname) + "?" + (TEST?"test=1&":"") + (params.has("sbtest")?"sbtest=1&":"") + "v=" + VERSION + "&g=" + encodeURIComponent(hostId);

  /* Test-Gäste (Bots): beantworten ca. 70 % richtig, ab und zu gar nicht */
  const BOT_NAMES=["Anna","Beat","Céline","Dario","Elena","Fabian","Gina","Hans","Ines","Jonas","Katrin","Luca","Mia","Nico","Olga","Pascal","Rahel","Simon","Tanja","Urs","Vreni","Walter","Yara","Zoe"];
  let botN=0;
  function addBots(n){
    for(let k=0;k<n;k++){
      const bot={open:true,bot:true,pid:null,_pending:false,close(){},on(){},
        send(v){
          if(v.phase!=="answer" || !v.me || !v.me.alive || v.me.answer!=null || this._pending) return;
          this._pending=true; const r=v.round;
          setTimeout(()=>{ this._pending=false;
            if(S.phase!=="answer" || S.round!==r || Math.random()<0.05) return;
            let c=S.q.correct;
            if(Math.random()>0.7){ const o=S.q.options.map((_,i)=>i).filter(i=>i!==c); c=o[Math.floor(Math.random()*o.length)]; }
            onMsg(bot,{t:"ans",round:r,choice:c});
          }, 800+Math.random()*Math.max(500,S.phaseMs-2000));
        }};
      const name=BOT_NAMES[botN%BOT_NAMES.length]+(botN>=BOT_NAMES.length?" "+(Math.floor(botN/BOT_NAMES.length)+1):"")+" 🤖";
      botN++;
      onMsg(bot,{t:"join",pid:"bot-"+rand(8),name});
    }
  }
  const save = () => store.set("hz_state", S);

  /* ---- Netzwerk ---- */
  function openPeer(tries){
    tries = tries||0;
    if(typeof supabase==="undefined" && !TEST){ peerErr="Supabase konnte nicht geladen werden (Internet?) – lade neu …"; render(); setTimeout(()=>location.reload(),8000); return; }
    peer = new Peer(hostId);
    peer.on("open",()=>{ peerOk=true; peerErr=""; render(); });
    peer.on("reconnected",()=>{ peerOk=true; render(); });
    peer.on("disconnected",()=>{ peerOk=false; render(); });
    peer.on("error",e=>{
      if(e.type==="config"){ peerErr="Supabase-Zugang fehlt noch (SUPABASE_CONFIG in der Datei)."; render(); return; }
      if(e.type==="broker"){ try{peer.destroy();}catch(_){} peerErr="Keine Verbindung zu Supabase – neuer Versuch …"; render(); setTimeout(()=>openPeer(tries+1),3000); return; }
      if(e.type==="unavailable-id" && tries<15){ peerErr="Spiel-ID wird noch freigegeben … neuer Versuch"; render(); try{peer.destroy();}catch(_){} setTimeout(()=>openPeer(tries+1),4000); return; }
      if(e.type==="peer-unavailable") return;
      peerErr="Verbindungsfehler: "+e.type; render();
      if(["network","server-error","socket-error","socket-closed"].includes(e.type)){ setTimeout(()=>{ try{ if(!peer.destroyed) peer.reconnect(); }catch(_){} },3000); }
    });
    peer.on("connection",conn=>{
      conn.on("data",d=>onMsg(conn,d));
      conn.on("close",()=>{ if(conn.pid && conns[conn.pid]===conn){ delete conns[conn.pid]; render(); } });
      conn.on("error",()=>{});
    });
  }

  function viewFor(pid){
    const p=S.players[pid];
    const v={t:"state",ver:VERSION,phase:S.phase,round:S.round,topic:S.topic,remaining:Math.max(0,S.endsAt-Date.now()),dur:S.phaseMs,
      alive:alive().length,total:list().length,me:p?{name:p.name,alive:p.alive,answer:p.answer,outRound:p.outRound||0,late:!!p.late}:null};
    if(S.q && ["read","answer","couple","reveal","blackout"].includes(S.phase)){ v.q=S.q.text; v.options=S.q.options; }
    if(S.jk){ v.jk={witness:!!S.jk.witness, apres:!!(S.jk.removed&&S.jk.removed.length), detour:!!S.jk.detour, revived:!!S.jk.revived}; }
    if(S.phase==="reveal"){ v.correct=S.q.correct; v.stats=S.stats; v.outNow=S.out.length; v.couple=S.couple; }
    if(S.phase==="end"){ v.winners=alive().map(p=>p.name); v.coupleLost=S.coupleLost; }
    return v;
  }
  function sendTo(pid){ const c=conns[pid]; if(c && c.open){ try{ c.send(viewFor(pid)); }catch(e){} } }
  function broadcast(){ save(); Object.keys(conns).forEach(sendTo); render(); }

  function onMsg(conn,d){
    if(!d || typeof d!=="object") return;
    if(d.t==="join"){
      const pid=String(d.pid||"").slice(0,40); if(!pid) return;
      const name=String(d.name||"").trim().slice(0,24)||"Gast";
      let p=S.players[pid];
      if(!p){ p=S.players[pid]={name,alive:pre(),answer:null,late:!pre(),outRound:0}; }
      else if(pre()){ p.name=name; }
      if(conns[pid] && conns[pid]!==conn){ try{conns[pid].close();}catch(e){} }
      conns[pid]=conn; conn.pid=pid;
      save(); sendTo(pid); render();
    }
    if(d.t==="ans"){
      const p=S.players[conn.pid];
      if(!p || !p.alive || S.phase!=="answer" || d.round!==S.round || p.answer!=null) return;
      const c=Number(d.choice); if(!(c>=0 && c<S.q.options.length)) return;
      p.answer=c; save(); sendTo(conn.pid); render();
      if(alive().every(x=>x.answer!=null)) setTimeout(()=>{ if(S.phase==="answer") toCouple(); },900);
    }
  }

  /* ---- Spielablauf ---- */
  function schedule(fn){ clearTimeout(timer); timer=setTimeout(fn, Math.max(0,S.endsAt-Date.now())); }
  function remainingIn(cat){ return cat.qs.filter(q=>!S.used.includes(q.q)); }

  function startRound(catName){
    const cat=bank.find(c=>c.name===catName); if(!cat) return;
    const pool=remainingIn(cat); if(!pool.length) return;
    const pick=pool[Math.floor(Math.random()*pool.length)];
    const options=shuffle([pick.right].concat(pick.wrong));
    S.used.push(pick.q);
    S.round++; S.topic=cat.name;
    S.q={text:pick.q,options,correct:options.indexOf(pick.right)};
    list().forEach(p=>{ S.players[p.id].answer=null; });
    S.out=[]; S.outIds=[]; S.stats=null; S.couple=null; S.jk={};
    toAnswer();
  }
  function toAnswer(){
    S.phase="answer"; S.phaseMs=S.settings.answer*1000; S.endsAt=Date.now()+S.phaseMs;
    schedule(toCouple); broadcast();
  }
  function toCouple(){
    clearTimeout(timer);
    S.phase="couple"; S.endsAt=0; S.couple=null; broadcast();
  }
  function toReveal(){
    if(S.couple==null) return;
    clearTimeout(timer);
    const stats=S.q.options.map(()=>0); let none=0;
    S.out=[]; S.outIds=[];
    alive().forEach(p=>{
      if(p.answer==null) none++; else stats[p.answer]++;
      if(p.answer!==S.q.correct){ S.players[p.id].alive=false; S.players[p.id].outRound=S.round; S.out.push(p.name); S.outIds.push(p.id); }
    });
    S.stats={counts:stats,none};
    S.coupleLost = S.couple!==S.q.correct;
    S.phase="reveal"; S.endsAt=0; broadcast();
  }
  function useAudience(){
    if(S.phase!=="couple" || S.jokers.audience) return;
    const counts=S.q.options.map(()=>0); let none=0;
    alive().forEach(p=>{ if(p.answer==null) none++; else counts[p.answer]++; });
    S.jk.audience={counts,none}; S.jokers.audience=true; broadcast();
  }
  function useExpert(pid){
    const p=S.players[pid];
    if(S.phase!=="couple" || S.jokers.expert || !p || !p.alive || p.answer==null) return;
    S.jk.expert={pid,name:p.name,answer:p.answer}; S.jokers.expert=true; picker=false; broadcast();
  }
  function useDetour(){
    if(!["read","answer","couple"].includes(S.phase) || S.jokers.detour) return;
    clearTimeout(timer); picker=false;
    const cat=bank.find(c=>c.name===S.topic); const pool=cat?remainingIn(cat):[];
    if(!pool.length){ alert("In diesem Thema gibt es keine weitere Frage mehr."); return; }
    const pick=pool[Math.floor(Math.random()*pool.length)];
    const options=shuffle([pick.right].concat(pick.wrong));
    S.used.push(pick.q);
    S.q={text:pick.q,options,correct:options.indexOf(pick.right)};
    S.jokers.detour=true; S.jk={detour:true}; S.couple=null;
    list().forEach(p=>{ S.players[p.id].answer=null; });
    toAnswer();
  }
  function useBlackout(){
    if(S.phase!=="couple" || S.jokers.blackout) return;
    clearTimeout(timer); picker=false;
    S.jokers.blackout=true; S.jk.blackout=true;
    list().forEach(p=>{ S.players[p.id].answer=null; });
    S.phase="blackout"; broadcast();
  }
  function useWitness(){
    if(S.phase!=="couple" || S.jokers.witness) return;
    S.jokers.witness=true; S.jk.witness=true; broadcast();
  }
  function useApres(){
    if(S.phase!=="couple" || S.jokers.apres) return;
    const wrong=S.q.options.map((_,i)=>i).filter(i=>i!==S.q.correct);
    const removed=shuffle(wrong).slice(0,Math.max(1,S.q.options.length-2));
    S.jk.removed=removed; S.jokers.apres=true; picker=false;
    if(removed.includes(S.couple)) S.couple=null;
    broadcast();
  }
  function useReanimate(){
    if(S.phase!=="reveal" || !S.coupleLost || S.jokers.reanimate) return;
    S.jokers.reanimate=true; S.jk.revived=true; S.coupleLost=false; broadcast();
  }
  function next(){ S.phase = (S.coupleLost || !alive().length) ? "end" : "topic"; broadcast(); }
  function endGame(){ clearTimeout(timer); S.phase="end"; broadcast(); }
  function newGame(){
    if(!confirm("Neues Spiel starten? Alle bleiben verbunden, aber Runden und Ausscheidungen werden zurückgesetzt.")) return;
    clearTimeout(timer);
    const players=S.players, settings=S.settings;
    S=fresh(); S.settings=settings; S.phase="lobby";
    Object.keys(players).forEach(id=>{ if(conns[id]) S.players[id]={name:players[id].name,alive:true,answer:null,late:false,outRound:0}; });
    broadcast();
  }

  /* Wiederaufnahme nach Neuladen */
  if(S.phase==="read"){ toAnswer(); }
  if(S.phase==="answer"){ if(S.endsAt<=Date.now()) S.endsAt=Date.now()+5000; schedule(toCouple); }

  /* ---- Darstellung ---- */
  function header(){
    const total=list().length, a=alive().length, online=Object.keys(conns).length;
    const inGame=!pre();
    let center;
    if(!inGame) center=`<div class="pill"><span>Lobby</span>Warten auf Gäste</div>`;
    else if(["read","answer","couple","reveal","blackout"].includes(S.phase)) center=`<div class="pill"><span>Runde ${S.round}</span>${esc(S.topic)}</div>`;
    else if(S.phase==="topic") center=`<div class="pill"><span>Runde ${S.round+1}</span>Themenwahl</div>`;
    else center=`<div class="pill"><span>Finale</span>${S.round} ${S.round===1?"Runde":"Runden"}</div>`;
    return `<header class="h-top">
      <div class="logo"><span class="names">${esc(COUPLE).replace("&amp;","<i>&amp;</i>")}</span><span class="vs">gegen <b>${esc(GUEST_LABEL)}</b></span></div>
      ${center}
      <div class="score">
        ${inGame?`<div class="led"><b>${a}</b><small>im Spiel</small></div><div class="led dim"><b>${total-a}</b><small>raus</small></div>`
          :`<div class="led"><b>${total}</b><small>Gäste</small></div>`}
        <span class="status"><span class="dot ${peerOk?"ok":"bad"}"></span>${peerOk?online+" online":"offline"}</span>
      </div></header>`;
  }

  function wall(){
    const ps=list(); if(!ps.length) return "";
    const nowOut=new Set(S.phase==="reveal"?(S.outIds||[]):[]);
    return `<div class="wall">${ps.map(p=>{
      let c="tile";
      if(S.phase==="lobby"){ if(!conns[p.id]) c+=" off"; }
      else if(!p.alive) c+= nowOut.has(p.id)?" outnow":" gone";
      return `<div class="${c}" title="${esc(p.name)}">${esc(p.name)}${S.phase==="lobby"?`<button data-kick="${esc(p.id)}" title="Entfernen">×</button>`:""}</div>`;
    }).join("")}</div>`;
  }

  function jokerCan(){
    return {detour:["read","answer","couple"].includes(S.phase), blackout:S.phase==="couple", witness:S.phase==="couple", apres:S.phase==="couple",
      reanimate:S.phase==="reveal" && S.coupleLost};
  }
  const JOKER_HINT={
    reanimate:"🚑 Den Reanimations-Joker könnt ihr einsetzen, sobald ihr bei der Auflösung falsch liegt.",
    blackout:"⚡ Den Stromausfall-Joker könnt ihr einsetzen, wenn ihr an der Reihe seid (nachdem die Gäste getippt haben).",
    witness:"💍 Den Trauzeugen-Joker könnt ihr einsetzen, wenn ihr an der Reihe seid.",
    apres:"🍻 Den Après-Ski-Joker könnt ihr einsetzen, wenn ihr an der Reihe seid.",
    detour:"🚲 Den Umweg-Joker könnt ihr einsetzen, sobald eine Frage auf dem Bildschirm steht."
  };
  let toastT=null;
  function toast(msg){
    let el=document.getElementById("toast"); if(!el){ el=document.createElement("div"); el.id="toast"; document.body.appendChild(el); }
    el.textContent=msg; el.className="show"; clearTimeout(toastT); toastT=setTimeout(()=>{ el.className=""; },3800);
  }
  function jokerBar(){
    const can=jokerCan();
    const j=(k,ic,label)=>{ const ok=can[k]&&!S.jokers[k];
      return `<button class="joker ${S.jokers[k]?"used":""} ${ok?"ready":""}" data-joker="${k}" ${S.jokers[k]?"disabled":""} title="${label}-Joker"><span class="ic">${ic}</span><span>${label}</span></button>`; };
    return `<div class="jokers">${j("reanimate","🚑","Reanimation")}${j("blackout","⚡","Stromausfall")}${j("witness","💍","Trauzeugen")}${j("apres","🍻","Après-Ski")}${j("detour","🚲","Umweg")}</div>`;
  }

  function lobbyView(){

  function questionView(){
    const reading=S.phase==="read", reveal=S.phase==="reveal", coupleTurn=S.phase==="couple";
    const a=alive(), answered=a.filter(p=>p.answer!=null).length;
    const jk=S.jk||{};
    const aud=null; const removed=jk.removed||[];
    const audTotal=aud ? aud.counts.reduce((x,y)=>x+y,0) : 0;
    const max=reveal?Math.max(1,...S.stats.counts):1;
    const opts=S.q.options.map((o,i)=>{
      let cls="opt";
      if(reading) cls+=" locked";
      if(reveal) cls+= i===S.q.correct?" right":" wrong";
      if((coupleTurn||reveal) && S.couple===i) cls+=" couple";
      const gone=coupleTurn && removed.includes(i);
      if(gone) cls+=" removed";
      const tags=[];
      if((coupleTurn||reveal) && S.couple===i) tags.push(`<span class="tag gold">💍 Brautpaar</span>`);
      if((coupleTurn||reveal) && jk.expert && jk.expert.answer===i) tags.push(`<span class="tag cyan">🎓 ${esc(jk.expert.name)}</span>`);
      let bar="", right="";
      if(reveal){ const cnt=S.stats.counts[i]; bar=`<span class="bar" style="width:${cnt/max*100}%"></span>`; right=`<span class="cnt">${cnt}</span>`; }
      else if(aud){ const pc=audTotal?Math.round(aud.counts[i]/audTotal*100):0; bar=`<span class="bar aud" style="width:${pc}%"></span>`; right=`<span class="cnt">${pc}%</span>`; }
      const inner=`<span class="frame hex"><span class="in hex">${bar}<span class="l">${LETTERS[i]}</span><span class="txt">${esc(o)}${tags.join("")}</span>${right}</span></span>`;
      return (coupleTurn&&!gone)?`<button class="${cls}" data-couple="${i}">${inner}</button>`:`<div class="${cls}">${inner}</div>`;
    }).join("");

    let info="";
    if(reading) info=`Lesezeit – gleich wird auf dem Handy geantwortet`;
    if(S.phase==="answer") info=`<b>${answered}</b> von <b>${a.length}</b> Gästen haben geantwortet`;
    if(coupleTurn) info= S.couple==null ? `Die Gäste haben getippt. Jetzt seid ihr dran, liebes Brautpaar!` : `Ist das eure endgültige Antwort?`;
    let jkInfo="";
    if((reading||S.phase==="answer") && jk.detour) jkInfo+=`<div class="jkres">🚲 Umweg-Joker: Das Brautpaar nimmt einen Umweg – hier ist eine neue Frage!</div>`;
    if(coupleTurn && jk.witness) jkInfo+=`<div class="jkres">💍 Trauzeugen-Joker: ${esc(WITNESS)} – bitte nach vorne kommen und mitberaten!</div>`;
    if(coupleTurn && removed.length) jkInfo+=`<div class="jkres">🍻 Après-Ski-Joker: Prost! Dafür ${removed.length===1?"ist eine falsche Antwort":"sind zwei falsche Antworten"} weg.</div>`;

    let revealHtml="";
    if(reveal){
      const left=alive().length;
      revealHtml=`<div class="verdict ${jk.revived?"revived":S.coupleLost?"bad":"good"}">${jk.revived?"Falsch – aber reanimiert! 🚑":S.coupleLost?"Das Brautpaar lag falsch!":"Das Brautpaar lag richtig!"}</div>
        ${S.coupleLost&&!S.jokers.reanimate?`<div class="info">Noch habt ihr den 🚑 Reanimations-Joker …</div>`:""}
        <div class="outline">${S.out.length?`<b class="red">${S.out.length}</b> ${S.out.length===1?"Gast scheidet":"Gäste scheiden"} aus${S.stats.none?` (${S.stats.none} ohne Antwort)`:""}`:"Kein Gast scheidet aus!"} · noch <b class="cy">${left}</b> im Spiel</div>
        ${wall()}`;
    }
    const label= reading?"Lesezeit":S.phase==="answer"?"Jetzt antworten!":coupleTurn?"Das Brautpaar ist dran":"Auflösung";
    return `<div class="qwrap${reveal?" rv":""}">
      <div class="qtop">
        <div class="phase">${reveal?"":`<span class="live"></span>`}${label}</div>
        ${(reveal||coupleTurn)?"<span></span>":ring(S.endsAt,S.phaseMs)}
        ${jokerBar()}
      </div>
      <div class="qpanel"><span class="frame hex"><span class="in hex"><h2 class="question">${esc(S.q.text)}</h2></span></span></div>
      <div class="opts">${opts}</div>
      ${info?`<div class="info">${info}</div>`:""}${jkInfo}
      ${revealHtml}
    </div>
    <div class="h-foot">
      ${reading?`<button class="btn ghost small" id="skip">Antworten freigeben</button>`:""}
      ${S.phase==="answer"?`<button class="btn ghost small" id="skip">Antwortzeit beenden</button>`:""}
      ${coupleTurn?`<button class="btn big" id="reveal" ${S.couple==null?"disabled":""}>Auflösen</button>`:""}
      ${reveal?`<button class="btn ghost small" id="end">Spiel beenden</button><button class="btn big" id="next">${(S.coupleLost||!alive().length)?"Zum Finale":"Nächste Runde"}</button>`:""}
    </div>`;
  }

  function crowdSvg(){
    const cols=["#7a2a4c","#2d4a7a","#5d3a7a","#9c4a3a","#2f6b5a","#8a6a2a","#4a2f5d","#a8455f","#35587d","#6b6b2f"];
    const skins=["#f1c9a5","#e3b48d","#c98f65","#f6d6bb","#a8714c"];
    const hairs=["#3b2418","#7a4526","#d9b46a","#1e1410","#a0522d","#8d8d8d"];
    let seed=7; const r=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
    const rows=[{n:8,y:118,s:.62,dim:.55},{n:7,y:172,s:.8,dim:.75},{n:6,y:236,s:1,dim:1}];
    let out="";
    rows.forEach((row,ri)=>{
      for(let i=0;i<row.n;i++){
        const x=(i+0.5)*(340/row.n)+10+(ri%2?10:-6)+(r()-.5)*10, y=row.y+(r()-.5)*8, s=row.s;
        const c=cols[Math.floor(r()*cols.length)], sk=skins[Math.floor(r()*skins.length)], hr=hairs[Math.floor(r()*hairs.length)];
        const phone=r()<.45, cheer=!phone && r()<.3;
        let g=`<g opacity="${row.dim}">`;
        if(phone) g+=`<path d="M${x+16*s} ${y+34*s} L${x+30*s} ${y-4*s}" stroke="${c}" stroke-width="${9*s}" stroke-linecap="round"/>
          <rect x="${x+24*s}" y="${y-22*s}" width="${11*s}" height="${18*s}" rx="${2*s}" fill="#fff1c4" class="ph"/>`;
        if(cheer) g+=`<path d="M${x-16*s} ${y+34*s} L${x-28*s} ${y-6*s}" stroke="${c}" stroke-width="${9*s}" stroke-linecap="round"/><path d="M${x+16*s} ${y+34*s} L${x+28*s} ${y-6*s}" stroke="${c}" stroke-width="${9*s}" stroke-linecap="round"/>`;
        g+=`<path d="M${x-26*s} ${y+100*s} L${x-26*s} ${y+44*s} Q${x-26*s} ${y+22*s} ${x} ${y+22*s} Q${x+26*s} ${y+22*s} ${x+26*s} ${y+44*s} L${x+26*s} ${y+100*s} Z" fill="${c}"/>
          <circle cx="${x}" cy="${y}" r="${16*s}" fill="${sk}"/>
          <path d="M${x-16*s} ${y-2*s} Q${x-16*s} ${y-18*s} ${x} ${y-18*s} Q${x+16*s} ${y-18*s} ${x+16*s} ${y-2*s} Q${x+8*s} ${y-10*s} ${x} ${y-10*s} Q${x-8*s} ${y-10*s} ${x-16*s} ${y-2*s}Z" fill="${hr}"/></g>`;
        out+=g;
      }
    });
    return `<svg viewBox="0 0 360 340" class="ill" aria-hidden="true">
      <defs><radialGradient id="glowG" cx="50%" cy="60%" r="55%"><stop offset="0" stop-color="rgba(255,159,184,.28)"/><stop offset="1" stop-color="rgba(255,159,184,0)"/></radialGradient>
      <clipPath id="crowdClip"><rect x="0" y="0" width="360" height="330"/></clipPath></defs>
      <ellipse cx="180" cy="200" rx="175" ry="150" fill="url(#glowG)"/>
      <g clip-path="url(#crowdClip)">${out}</g>
    </svg>`;
  }

  function titleView(){
    return `<div class="tshot">
      <div class="tshot-bg" style="background-image:url('${TITLE_IMAGE}')"></div>
      <img class="tshot-img" src="${TITLE_IMAGE}" alt="${esc(COUPLE)} gegen ihre Gäste – Quiz">
      <button class="btn big tshot-btn" id="toLobby">Starten</button>
    </div>`;
  }

  let qrDrawnFor="";
  function render(){
    let body="";
    if(S.phase==="title") body=titleView();
    else if(S.phase==="lobby") body=lobbyView();
    else if(S.phase==="topic") body=topicView();
    else if(["read","answer","couple","reveal"].includes(S.phase)) body=questionView();
    else if(S.phase==="blackout") body=blackoutView();
    else body=endView();
    const focused=document.activeElement && document.activeElement.id;
    if(editor && $("#bankText")) return; // Editor offen: nicht überschreiben
    app.innerHTML = (S.phase==="title"?"":header()) + `<main class="h-main">${body}</main>` + (editor?editorView():(picker==="apres" && S.phase==="couple")?apresView():"");
    if(focused && $("#"+focused) && focused.startsWith("set")) $("#"+focused).focus();
    const qr=$("#qr");
    if(qr && typeof QRCode!=="undefined"){ new QRCode(qr,{text:joinUrl(),width:260,height:260,colorDark:"#050816",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M}); qrDrawnFor=joinUrl(); }
  }

  app.addEventListener("click",e=>{
    const t=e.target.closest("button"); if(!t) return;
    if(t.dataset.kick){ const p=S.players[t.dataset.kick]; if(p && confirm(`${p.name} entfernen?`)){ const c=conns[t.dataset.kick]; delete S.players[t.dataset.kick]; if(c){ delete conns[t.dataset.kick]; try{c.close();}catch(_){} } broadcast(); } return; }
    if(t.dataset.cat){ startRound(t.dataset.cat); return; }
    if(t.dataset.joker){ const k=t.dataset.joker;
      if(S.jokers[k]) return;
      if(!jokerCan()[k]){ toast(JOKER_HINT[k]); return; }
      if(k==="detour"){ if(S.phase==="read" || confirm("Umweg-Joker einsetzen? Es gibt eine neue Frage und alle tippen nochmals neu.")) useDetour(); }
      if(k==="blackout"){ if(confirm("Stromausfall-Joker einsetzen? Die Frage zählt dann nicht.")) useBlackout(); }
      if(k==="witness") useWitness();
      if(k==="apres" && S.phase==="couple" && !S.jokers.apres){ picker="apres"; render(); }
      if(k==="reanimate") useReanimate();
      return; }
    if(t.dataset.expert){ useExpert(t.dataset.expert); return; }
    if(t.dataset.couple!=null && S.phase==="couple"){ S.couple=+t.dataset.couple; broadcast(); return; }
    switch(t.id){
      case "start": S.phase="topic"; list().forEach(p=>{ S.players[p.id].alive=true; S.players[p.id].late=false; }); broadcast(); break;
      case "skip": S.phase==="read"?toAnswer():toCouple(); break;
      case "reveal": picker=false; toReveal(); break;
      case "expCancel": picker=false; render(); break;
      case "apresCancel": picker=false; render(); break;
      case "apresGo": useApres(); break;
      case "afterBlackout": S.phase="topic"; broadcast(); break;
      case "expRandom": { const c=alive().filter(p=>p.answer!=null); if(c.length) useExpert(c[Math.floor(Math.random()*c.length)].id); break; }
      case "next": next(); break;
      case "end": if(confirm("Spiel jetzt beenden? Wer noch dabei ist, gewinnt.")) endGame(); break;
      case "restart": newGame(); break;
      case "editQ": editor=true; render(); break;
      case "toTitle": S.phase="title"; broadcast(); break;
      case "toLobby": S.phase="lobby"; broadcast(); break;
      case "photoDel": store.del("hz_photo"); render(); break;
      case "openPhone": window.open(joinUrl(),"_blank","width=420,height=860"); break;
      case "bots": addBots(10); break;
      case "bankCancel": editor=false; app.innerHTML=""; render(); break;
      case "bankReset": if(confirm("Alle eigenen Änderungen verwerfen?")) $("#bankText").value=DEFAULT_QUESTIONS; break;
      case "bankSave": {
        const txt=$("#bankText").value, parsed=parseBank(txt);
        if(!parsed.length){ alert("Keine gültigen Fragen gefunden. Bitte das Format prüfen."); return; }
        bankText=txt; bank=parsed; store.set("hz_bank",txt); editor=false; app.innerHTML=""; render(); break;
      }
    }
  });
  app.addEventListener("change",e=>{
    if(e.target.id!=="photoIn" || !e.target.files || !e.target.files[0]) return;
    const fr=new FileReader();
    fr.onload=()=>{ const img=new Image(); img.onload=()=>{
      const m=700, sc=Math.min(1,m/Math.max(img.width,img.height)), cv=document.createElement("canvas");
      cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      store.set("hz_photo",cv.toDataURL("image/jpeg",.85)); render();
    }; img.src=fr.result; };
    fr.readAsDataURL(e.target.files[0]);
  });
  app.addEventListener("input",e=>{
    if(e.target.id==="setRead") S.settings.read=Math.min(60,Math.max(3,+e.target.value||10));
    if(e.target.id==="setAns") S.settings.answer=Math.min(60,Math.max(3,+e.target.value||10));
    save();
  });

  render(); openPeer();
}
