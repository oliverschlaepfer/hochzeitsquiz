/* =====================  SPIELER  ======================== */
/* ======================================================== */
function player(){
  let pid=store.get("hz_pid",null); if(!pid){ pid=rand(14); store.set("hz_pid",pid); }
  let name=store.get("hz_name","");
  const joinedKey="hz_joined_"+GAME;
  let wantJoin=!!(name && store.get(joinedKey,false));
  let peer=null, conn=null, view=null, connected=false, status="", retryT=null, openT=null, fails=0;

  function retry(ms){ connected=false; clearTimeout(retryT); retryT=setTimeout(dial, ms||2500); render(); }
  function ensurePeer(cb){
    if(peer && !peer.destroyed && peer.open){ cb(); return; }
    if(typeof supabase==="undefined" && !TEST){ status="Keine Internetverbindung? Seite wird neu geladen …"; render(); setTimeout(()=>location.reload(),5000); return; }
    if(peer){ try{peer.destroy();}catch(e){} }
    peer=new Peer();
    peer.on("open",()=>cb());
    peer.on("disconnected",()=>{ try{ if(!peer.destroyed) peer.reconnect(); }catch(e){} });
    peer.on("error",e=>{
      if(e.type==="peer-unavailable"){ status="Spiel nicht gefunden – ist der Bildschirm des Brautpaars offen?"; retry(4000); return; }
      status = e.type==="config" ? "Das Spiel ist noch nicht fertig eingerichtet." : "Keine Verbindung zum Server – neuer Versuch …";
      try{peer.destroy();}catch(_){} peer=null; retry(3000);
    });
  }
  function dial(){
    clearTimeout(retryT);
    status = fails>=2 ? "Verbindung klappt nicht. Tipp: ins WLAN des Festsaals wechseln (oder WLAN aus, mobile Daten an)." : "Verbinde …";
    render();
    ensurePeer(()=>{
      if(conn){ try{conn.close();}catch(e){} }
      conn=peer.connect(GAME,{reliable:true,metadata:{pid,name}});
      clearTimeout(openT);
      openT=setTimeout(()=>{ if(!connected){ fails++; try{conn.close();}catch(e){} retry(500); } },12000);
      conn.on("open",()=>{ clearTimeout(openT); connected=true; fails=0; status="Verbunden – warte auf den Bildschirm des Brautpaars …"; conn.send({t:"join",pid,name}); render(); });
      conn.on("data",d=>{ if(d && d.t==="state" && d.ver && d.ver!==VERSION && !sessionStorage.getItem("hz_rl")){ try{ sessionStorage.setItem("hz_rl","1"); }catch(e){} location.reload(); return; }
        if(d && d.t==="state"){ status=""; view=d; view.deadline=Date.now()+d.remaining; render(); } });
      conn.on("close",()=>{ if(connected){ status="Verbindung unterbrochen – verbinde neu …"; retry(1500); } });
      conn.on("error",()=>{});
    });
  }

  function top(){
    return `<div class="p-top"><div class="logo"><span class="names">${esc(COUPLE).replace("&amp;","<i>&amp;</i>")}</span><span class="vs">gegen <b>${esc(GUEST_LABEL)}</b></span></div>
      <span class="status"><span class="dot ${connected?"ok":"bad"}"></span>${connected?esc(name):"offline"}</span></div>`;
  }

  function nameView(){
    return `<div class="p-body">
      <div class="eyebrow" style="text-align:center">Hochzeits-Quiz</div>
      <h1>Spielst du gegen das Brautpaar?</h1>
      <p class="muted">Gib deinen Namen ein – so erscheinst du auf der Leinwand.</p>
      <input type="text" id="nm" maxlength="24" placeholder="Dein Name" value="${esc(name)}" autocomplete="given-name">
      <button class="btn" id="go">Mitspielen</button></div>`;
  }

  function optsHtml(v, clickable){
    return `<div class="opts">${v.options.map((o,i)=>{
      let cls="opt"; const me=v.me||{};
      if(v.phase==="read") cls+=" locked";
      if(me.answer===i) cls+=" picked";
      if(v.phase==="reveal"){ cls+= i===v.correct?" right":" wrong"; }
      const inner=`<span class="frame hex"><span class="in hex"><span class="l">${LETTERS[i]}</span><span class="txt">${esc(o)}</span></span></span>`;
      return clickable ? `<button class="${cls}" data-ans="${i}">${inner}</button>` : `<div class="${cls}">${inner}</div>`;
    }).join("")}</div>`;
  }

  function gameView(){
    const v=view, me=(v&&v.me)||{};
    if(!v) return `<div class="p-body"><div class="big-emoji">💍</div><h1>Verbinde …</h1><p class="muted">${esc(status)}</p></div>`;
    const outBadge = !me.alive && !["lobby","title","end"].includes(v.phase)
      ? `<div class="badge out">${me.late?"Du schaust zu (später dazugekommen)":"Ausgeschieden in Runde "+me.outRound+" – du schaust zu"}</div>` : "";
    switch(v.phase){
      case "title":
      case "lobby": return `<div class="p-body"><div class="big-emoji">🥂</div><h1>Du bist dabei, ${esc(me.name||name)}!</h1>
        <p class="muted">Schau auf die Leinwand – gleich geht's los. ${v.total} ${v.total===1?"Gast ist":"Gäste sind"} schon angemeldet.</p></div>`;
      case "topic": return `<div class="p-body">${outBadge}<div class="big-emoji">💑</div><h1>Das Brautpaar wählt ein Thema …</h1>
        <p class="muted">Noch ${v.alive} von ${v.total} im Spiel.</p></div>`;
      case "read": return `<div class="p-body">${outBadge}<div class="eyebrow" style="text-align:center">${esc(v.topic)} · Runde ${v.round}</div>
        <div class="qhead">${ring(v.deadline,v.dur)}</div>
        <div class="qpanel"><span class="frame hex"><span class="in hex"><h2 class="question">${esc(v.q)}</h2></span></span></div>${optsHtml(v,false)}
        ${v.jk&&v.jk.detour?`<div class="badge cy">🚲 Umweg-Joker: neue Frage!</div>`:""}
        <div class="hint">Lesezeit – gleich kannst du antworten.</div></div>`;
      case "answer": {
        const can=me.alive && me.answer==null;
        return `<div class="p-body">${outBadge}<div class="eyebrow" style="text-align:center">${esc(v.topic)} · Runde ${v.round}</div>
        <div class="qhead">${ring(v.deadline,v.dur)}</div>
        <div class="qpanel"><span class="frame hex"><span class="in hex"><h2 class="question">${esc(v.q)}</h2></span></span></div>${optsHtml(v,can)}
        ${v.jk&&v.jk.detour?`<div class="badge cy">🚲 Umweg-Joker: neue Frage!</div>`:""}
        <div class="hint">${me.alive?(me.answer==null?"Tippe auf deine Antwort – sie zählt sofort.":"Antwort "+LETTERS[me.answer]+" ist gespeichert."):""}</div></div>`;
      }
      case "couple": {
        const jk=v.jk||{};
        return `<div class="p-body">${outBadge}<div class="big-emoji">💍</div><h1>Das Brautpaar ist dran …</h1>
        <p class="muted">${me.alive?(me.answer==null?"Du hast nicht rechtzeitig geantwortet.":"Deine Antwort: "+LETTERS[me.answer]+" – "+esc(v.options[me.answer])):"Schau auf die Leinwand."}</p>
        ${jk.witness?`<div class="badge cy">💍 Trauzeugen-Joker eingesetzt</div>`:""}
        ${jk.apres?`<div class="badge gold">🍻 Après-Ski-Joker: Prost aufs Brautpaar!</div>`:""}</div>`;
      }
      case "blackout": {
        return `<div class="p-body">${outBadge}<div class="big-emoji">⚡</div><h1>Stromausfall!</h1>
          <p class="muted">Das Brautpaar hat den Stromausfall-Joker gezogen. Diese Frage zählt nicht${me.alive?" – du bist weiter dabei!":"."}</p></div>`;
      }
      case "reveal": {
        let msg="";
        if(me.outRound===v.round && !me.late) msg = me.answer==null
          ? `<div class="big-emoji">⏰</div><h1>Zu spät!</h1><p class="muted">Leider keine Antwort – du bist raus.</p>`
          : `<div class="outshot">
              <div class="tshot-bg" style="background-image:url('${OUT_IMAGE}')"></div>
              <img class="outshot-img" src="${OUT_IMAGE}" alt="Falsche Antwort – du bist leider ausgeschieden">
              <div class="outshot-cap">Richtig war <b>${LETTERS[v.correct]}: ${esc(v.options[v.correct])}</b></div>
            </div>`;
        else if(me.alive) msg=`<div class="big-emoji">🎉</div><h1>Richtig!</h1><p class="muted">Du bist weiter dabei – noch ${v.alive} im Spiel.</p>`;
        else msg=`${outBadge}<p class="muted">Richtig war ${LETTERS[v.correct]}: ${esc(v.options[v.correct])}</p>`;
        const rv=v.jk&&v.jk.revived;
        const cp = v.couple!=null ? `<div class="badge ${v.couple===v.correct?"ok":rv?"cy":"out"}">${v.couple===v.correct?"Das Brautpaar lag richtig":rv?"Das Brautpaar lag falsch – wurde aber reanimiert 🚑":"Das Brautpaar lag falsch"}</div>` : "";
        return `<div class="p-body">${msg}${cp}</div>`;
      }
      case "end": {
        const won=me.alive;
        return `<div class="p-body"><div class="big-emoji">${won?"🏆":"💐"}</div>
          <h1>${won?"Du hast das Brautpaar geschlagen!":(v.winners.length?"Spiel vorbei":(v.coupleLost?"Unentschieden!":"Das Brautpaar gewinnt!"))}</h1>
          <p class="muted">${v.winners.length?(v.coupleLost?"Das Brautpaar lag falsch. ":"")+"Gewonnen: "+v.winners.map(esc).join(", "):(v.coupleLost?"Brautpaar und Gäste lagen alle falsch.":"Alle Gäste sind ausgeschieden.")}</p></div>`;
      }
    }
    return "";
  }

  function render(){
    const focusName = document.activeElement && document.activeElement.id==="nm";
    if(focusName) return;
    let body = !wantJoin ? nameView() : gameView();
    if(wantJoin && status && view) body += `<div class="hint">${esc(status)}</div>`;
    app.innerHTML = `<div class="p">${top()}${body}</div>`;
  }

  function join(){
    const v=($("#nm")||{}).value; name=String(v||"").trim().slice(0,24);
    if(!name){ $("#nm").focus(); return; }
    store.set("hz_name",name); store.set(joinedKey,true); wantJoin=true;
    document.activeElement && document.activeElement.blur();
    render(); dial();
  }
  app.addEventListener("click",e=>{
    const t=e.target.closest("button"); if(!t) return;
    if(t.id==="go") join();
    if(t.dataset.ans!=null && view && view.phase==="answer" && view.me && view.me.alive && view.me.answer==null && conn && connected){
      const c=+t.dataset.ans; conn.send({t:"ans",round:view.round,choice:c});
      view.me.answer=c; if(navigator.vibrate) navigator.vibrate(30); render();
    }
  });
  app.addEventListener("keydown",e=>{ if(e.key==="Enter" && e.target.id==="nm") join(); });
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden && wantJoin && !connected) dial(); });

  render(); if(wantJoin) dial();
}

(function decorate(){
  const st=$("#stage"); if(!st) return;
  const W=100, pts=[]; let html="";
  // Lichterkette: zwei durchhängende Bögen
  let path="";
  [[0,50],[50,100]].forEach(([a,b])=>{
    path+=`M${a} 0 Q${(a+b)/2} 70 ${b} 0 `;
    for(let i=1;i<14;i++){ const t=i/14, x=a+(b-a)*t, y=2*(1-t)*t*70; pts.push([x,y]); }
  });
  let wire="";
  [[0,50],[50,100]].forEach(([a,b])=>{ wire+=`M${a} 4 Q${(a+b)/2} ${4+2*26} ${b} 4 `; });
  html+=`<svg class="garland-wire" viewBox="0 0 100 60" preserveAspectRatio="none"><path d="${wire}" vector-effect="non-scaling-stroke"/></svg>`;
  pts.forEach((p,i)=>{ html+=`<span class="bulb" style="left:${p[0]}%;top:${(4+p[1]/35*26).toFixed(1)}px;animation-delay:-${(i*.37%1.6).toFixed(2)}s"></span>`; });
  // aufsteigende Lichtpunkte
  for(let i=0;i<26;i++){ const s=10+Math.random()*46;
    html+=`<span class="bokeh${i%3===0?" r":""}" style="left:${(Math.random()*100).toFixed(1)}%;bottom:-${s}px;width:${s|0}px;height:${s|0}px;animation-duration:${(18+Math.random()*24).toFixed(1)}s,${(1.5+Math.random()*2.5).toFixed(1)}s;animation-delay:-${(Math.random()*40).toFixed(1)}s,-${(Math.random()*3).toFixed(1)}s"></span>`; }
  // Funkeln
  for(let i=0;i<18;i++){ html+=`<span class="spark" style="left:${(Math.random()*100).toFixed(1)}%;top:${(15+Math.random()*80).toFixed(1)}%;font-size:${8+Math.random()*12|0}px;animation-delay:-${(Math.random()*2.2).toFixed(2)}s">✦</span>`; }
  st.innerHTML=html;
})();
if(params.has("check")) connectionCheck(); else if(GAME) player(); else host();
})();
</script>
